<!DOCTYPE html>
<html>
<head>
    <title>Campus Notification</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <h1>Campus Notification System</h1>
    <div class="container">
        <div class="card">
            <h2>Placement Update</h2>
            <p>TCS interview on Monday at 10 AM.</p>
        </div>

    <button onclick="showMessage()">
        Show Notification

    <script src="script.js"></script>

</body>
</html>
